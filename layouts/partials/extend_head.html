<style>
    .main {
        opacity: 0;
        animation: fadeInUp 1s ease-out forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* 為不同部分添加延遲動畫 */
    .profile {
        animation-delay: 0.2s;
        max-width: 100%;         /* 容器最大寬度 */
        padding: 0;              /* 移除內邊距 */
    }
    
    .post-entry {
        animation-delay: 0.4s;
    }
    
    .social-icons {
        animation-delay: 0.6s;
    }

    /* 自定義封面圖片樣式 */
    .profile img {
        width: 100%;              /* 寬度設為 100% */
        height: auto;             /* 高度自動調整保持比例 */
        max-width: 100%;          /* 最大寬度 100% */
        border-radius: 0;         /* 移除圓角 */
        object-fit: cover;        /* 確保圖片覆蓋整個區域 */
        margin: 0;               /* 移除預設邊距 */
        box-shadow: 0 0 10px rgba(0,0,0,0.1);  /* 陰影效果 */
        transition: transform 0.3s;    /* 過渡效果 */
    }
    
    .profile img:hover {
        transform: scale(1.05);       /* 滑鼠懸停時放大效果 */
    }

    /* 文字高亮樣式 */
    .post-content mark,
    article mark {
        background-color: #fff2007f !important;    /* 淺黃色背景 */
        padding: 0 4px !important;                 /* 左右間距 */
        color: #e9e9e9 !important;                 /* 文字顏色改為藍色 */
        font-weight: 500 !important;               /* 稍微加粗 */
    }

    /* 暗色模式下的樣式 */
    [theme="dark"] .post-content mark,
    [theme="dark"] article mark {
        background-color: #fff2007f !important;    /* 保持相同背景 */
        color: #000000 !important;                 /* 暗色模式下使用較亮的藍色 */
    }
</style>
